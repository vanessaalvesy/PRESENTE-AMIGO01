<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Surpresa</title>

<style>

body{
font-family: Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
text-align:center;
margin:0;
}

.caixa{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.bolo{
font-size:80px;
}

input{
padding:10px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
}

button{
margin-top:10px;
padding:10px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

</style>

<script>

function verificar(){

var senha = document.getElementById("senha").value;

if(
senha=="10/07/2006" ||
senha=="10-07-2006" ||
senha=="10072006"
){

window.location.href="surpresa.html";
window.location.href="jogo.html";
}else{

alert("Data errada 😅");

}

}

</script>

</head>

<body>

<div class="caixa">

<h1>🎉 Surpresa Cássio 🎉</h1>

<div class="bolo">🎂</div>

<p>Digite a data do meu aniversário:</p>

<input type="text" id="senha" placeholder="Ex: 12/07/2008">

<br><br>

<button onclick="verificar()">Entrar</button>

</div>

</body>
</html>
